<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f3eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Second Chance</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./app.css">
<style>
#boot{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;padding:24px;background:#f7f3eb;color:#2f3b35;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center}
#boot .bootcard{width:min(430px,100%);background:#fffdfa;border:1px solid #d9d7cf;border-radius:28px;padding:26px;box-shadow:0 14px 50px rgba(47,59,53,.08)}
#boot h1{font-family:Georgia,serif;font-size:38px;line-height:.96;margin:0 0 12px}
#boot p{color:#6d7872;line-height:1.55;margin:0}
#boot .bootdot{width:12px;height:12px;border-radius:50%;background:#c87559;margin:18px auto;animation:bootpulse 1s infinite alternate}
#boot .debug{margin-top:10px;font-size:11px;line-height:1.4;color:#8a6658;word-break:break-word}
@keyframes bootpulse{to{opacity:.25;transform:scale(.7)}}
#boot .retry{display:none;margin:16px auto 0;border:0;background:#c87559;color:#fff;border-radius:14px;padding:11px 16px;font-weight:800}
#installPrompt{position:fixed;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:80;display:none;align-items:center;gap:8px;background:#2f3b35;color:#fffdfa;border-radius:999px;padding:7px 7px 7px 12px;box-shadow:0 10px 35px rgba(47,59,53,.22);font-size:12px;font-weight:750}
#installPrompt button{border:0;background:#fffdfa;color:#2f3b35;border-radius:999px;padding:8px 11px;font-weight:800}
@media(max-width:520px){#installPrompt{left:12px;right:12px;justify-content:space-between}}
</style>
</head>
<body>
<div id="boot"><div class="bootcard"><h1>Second Chance</h1><p id="bootText">Loading your journey…</p><div class="bootdot" id="bootDot"></div><div class="debug" id="bootDebug"></div><button class="retry" id="bootRetry" type="button">Reload app</button></div></div>
<div id="app"></div>
<div id="toast" class="toast" aria-live="polite"></div>
<div id="installPrompt"><span>Want this on your phone?</span><button id="installBtn" type="button">Add app</button></div>
<script>
(function(){
  /* Some Android/in-app browsers can expose sessionStorage but throw a SecurityError when it is read.
     Give the pilot a temporary in-memory fallback instead of letting that kill the entire app. */
  try{
    window.sessionStorage.getItem('__sc_probe__');
  }catch(storageError){
    try{
      const memory={};
      Object.defineProperty(window,'sessionStorage',{
        configurable:true,
        value:{
          getItem:k=>Object.prototype.hasOwnProperty.call(memory,k)?memory[k]:null,
          setItem:(k,v)=>{memory[k]=String(v)},
          removeItem:k=>{delete memory[k]},
          clear:()=>{for(const k of Object.keys(memory))delete memory[k]}
        }
      });
    }catch(_ignored){}
  }

  const params=new URLSearchParams(location.search),incoming=params.get('invite');
  if(incoming){try{localStorage.setItem('sc_invite_token',incoming)}catch{}}
  if(!params.get('creator')&&!incoming){
    let saved='';try{saved=localStorage.getItem('sc_invite_token')||''}catch{}
    if(saved)history.replaceState(null,'',location.pathname+'?invite='+encodeURIComponent(saved));
  }

  let bootError='';
  window.addEventListener('error',e=>{
    const where=e.filename?(' · '+e.filename.split('/').pop()+':'+(e.lineno||'?')):'';
    bootError=(e.message||'A startup resource failed')+where;
  },true);
  window.addEventListener('unhandledrejection',e=>{bootError=e.reason?.message||String(e.reason||'The app hit a startup error.')});
  window.__secondChanceBootCheck=()=>{
    const boot=document.getElementById('boot'),app=document.getElementById('app'),text=document.getElementById('bootText'),dot=document.getElementById('bootDot'),retry=document.getElementById('bootRetry'),debug=document.getElementById('bootDebug');
    setTimeout(()=>{
      if(app&&app.innerHTML.trim()){boot.style.display='none';return;}
      text.textContent='Second Chance hit a startup problem. Tap reload and I’ll try again.';
      debug.textContent=bootError?('Error: '+bootError):'Error: app did not render.';
      dot.style.display='none';retry.style.display='inline-block';retry.onclick=()=>location.reload();
    },1000);
  };
})();
</script>
<script src="./steps.js?v=20260824-2051"></script>
<script src="./app.js?v=20260824-2051"></script>
<script>
window.__secondChanceBootCheck?.();
let installEvent=null,bar=document.getElementById('installPrompt'),btn=document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvent=e;bar.style.display='flex'});
btn.addEventListener('click',async()=>{if(!installEvent)return;installEvent.prompt();try{await installEvent.userChoice}catch{}installEvent=null;bar.style.display='none'});
window.addEventListener('appinstalled',()=>{bar.style.display='none';installEvent=null});
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js?v=20260824-2051').catch(()=>{}));
</script>
</body>
</html>
