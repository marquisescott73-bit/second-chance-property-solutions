<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f3eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Second Chance</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f3eb;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#2f3b35}#frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f7f3eb}#loading{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;background:#f7f3eb;z-index:8}.card{max-width:440px;background:#fffdfa;border:1px solid #d9d7cf;border-radius:28px;padding:26px;box-shadow:0 14px 50px rgba(47,59,53,.08)}h1{font-family:Georgia,serif;font-size:38px;line-height:.96;margin:0 0 12px}.muted{color:#6d7872;line-height:1.55}.dot{width:12px;height:12px;border-radius:50%;background:#c87559;margin:18px auto;animation:pulse 1s infinite alternate}@keyframes pulse{to{opacity:.25;transform:scale(.7)}}button{border:0;background:#c87559;color:white;border-radius:14px;padding:10px 14px;font-weight:800;cursor:pointer}#install{position:fixed;right:12px;bottom:max(12px,env(safe-area-inset-bottom));z-index:20;display:none;align-items:center;gap:8px;background:#2f3b35;color:#fffdfa;border-radius:999px;padding:7px 7px 7px 12px;box-shadow:0 10px 35px rgba(47,59,53,.22);font-size:12px;font-weight:750}#install button{background:#fffdfa;color:#2f3b35;border-radius:999px;font-size:12px}@media(max-width:520px){#install{left:12px;right:12px;justify-content:space-between}}
</style>
</head>
<body>
<div id="loading"><div class="card"><h1>Second Chance</h1><div class="muted">Loading your journey…</div><div class="dot"></div></div></div>
<iframe id="frame" title="Second Chance OS"></iframe>
<div id="install"><span>Want this on your phone?</span><button id="installBtn">Add app</button></div>
<script>
const frame=document.getElementById('frame'),loading=document.getElementById('loading');frame.src='./app.html'+location.search;frame.addEventListener('load',()=>loading.style.display='none');setTimeout(()=>loading.style.display='none',8000);
let promptEvent=null;const bar=document.getElementById('install'),btn=document.getElementById('installBtn');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();promptEvent=e;bar.style.display='flex'});btn.onclick=async()=>{if(!promptEvent)return;promptEvent.prompt();try{await promptEvent.userChoice}catch{}promptEvent=null;bar.style.display='none'};window.addEventListener('appinstalled',()=>bar.style.display='none');if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body>
</html>
