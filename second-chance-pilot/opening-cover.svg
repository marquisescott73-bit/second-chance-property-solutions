<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100" role="img" aria-labelledby="title desc">
  <title id="title">Second Chance journal cover</title>
  <desc id="desc">Warm cream desk with a journal that reads What if your second chance changed everything?</desc>
  <defs>
    <linearGradient id="desk" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6eadb"/>
      <stop offset="1" stop-color="#e6ccb2"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffdf8"/>
      <stop offset="1" stop-color="#efe5d5"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#6d4f3c" flood-opacity=".22"/>
    </filter>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="900" height="1100" rx="54" fill="url(#desk)"/>
  <ellipse cx="735" cy="126" rx="116" ry="48" fill="#b78b68" opacity=".16" filter="url(#soft)"/>

  <!-- stacked journals -->
  <g transform="translate(18 82) rotate(-5 118 100)" filter="url(#shadow)">
    <rect x="0" y="54" width="235" height="126" rx="12" fill="#f9f6ef"/>
    <rect x="10" y="28" width="225" height="126" rx="12" fill="#d8c3ab"/>
    <rect x="21" y="0" width="218" height="126" rx="12" fill="#ba9875"/>
  </g>

  <!-- mug -->
  <g transform="translate(668 42)" filter="url(#shadow)">
    <ellipse cx="92" cy="72" rx="76" ry="68" fill="#e8ded1"/>
    <ellipse cx="92" cy="58" rx="58" ry="42" fill="#c9b8a7"/>
    <ellipse cx="92" cy="58" rx="49" ry="33" fill="#8a6751"/>
    <path d="M155 47c54-4 66 66 8 72" fill="none" stroke="#e8ded1" stroke-width="24" stroke-linecap="round"/>
  </g>

  <!-- notebook -->
  <g transform="translate(152 225) rotate(-6 292 354)" filter="url(#shadow)">
    <rect x="22" y="20" width="586" height="714" rx="30" fill="#d7c8b3" opacity=".65"/>
    <rect x="0" y="0" width="586" height="714" rx="30" fill="url(#paper)" stroke="#d8cdbd" stroke-width="3"/>
    <path d="M533 12v689" stroke="#d2c6b4" stroke-width="10" opacity=".7"/>
    <path d="M36 702v72l18-20 18 20v-74" fill="#d7c7ae"/>

    <text x="64" y="112" font-family="Arial, Helvetica, sans-serif" font-size="51" font-weight="800" fill="#262824" letter-spacing="-1">
      <tspan x="64" dy="0">WHAT IF YOUR</tspan>
      <tspan x="64" dy="58">SECOND CHANCE</tspan>
      <tspan x="64" dy="58">CHANGED</tspan>
      <tspan x="64" dy="58">EVERYTHING?</tspan>
    </text>

    <text x="65" y="555" font-family="Georgia, 'Times New Roman', serif" font-size="29" font-style="italic" fill="#3e3d37">
      <tspan x="65" dy="0">A journal for the parts of your</tspan>
      <tspan x="65" dy="39">story that broke you, built you,</tspan>
      <tspan x="65" dy="39">and brought you back stronger.</tspan>
    </text>
  </g>

  <!-- pen -->
  <g transform="translate(732 615) rotate(14)" filter="url(#shadow)">
    <rect x="0" y="0" width="28" height="302" rx="14" fill="#242522"/>
    <rect x="7" y="-24" width="14" height="46" rx="7" fill="#333531"/>
    <path d="M4 300h20l-10 31z" fill="#1f201e"/>
    <path d="M25 46h17v102" fill="none" stroke="#242522" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- note sheet -->
  <g transform="translate(694 825) rotate(7)" opacity=".85">
    <rect width="220" height="250" rx="12" fill="#faf8f2"/>
    <text x="24" y="54" font-family="Georgia,serif" font-size="23" fill="#70675d">• Be kind</text>
    <text x="24" y="91" font-family="Georgia,serif" font-size="23" fill="#70675d">• Heal</text>
    <text x="24" y="128" font-family="Georgia,serif" font-size="23" fill="#70675d">• Grow</text>
    <ellipse cx="126" cy="190" rx="70" ry="36" fill="none" stroke="#a79788" stroke-width="2"/>
    <text x="86" y="184" font-family="Georgia,serif" font-size="18" font-style="italic" fill="#817367">Focus on</text>
    <text x="103" y="207" font-family="Georgia,serif" font-size="18" font-style="italic" fill="#817367">impact</text>
  </g>
</svg>