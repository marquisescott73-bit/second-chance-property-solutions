<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f3eb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Second Chance">
  <title>Second Chance — What If It All Went Right?</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <style>
    html,body{margin:0;width:100%;height:100%;background:#f7f3eb;overflow:hidden}
    #appFrame{display:block;width:100%;height:100%;border:0;background:#f7f3eb}
    #loading{position:fixed;inset:0;display:grid;place-items:center;background:#f7f3eb;color:#2f3b35;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;z-index:2;transition:opacity .2s ease}
    #loading.hide{opacity:0;pointer-events:none}
    .loadCard{text-align:center;padding:28px}
    .mark{width:64px;height:64px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;background:#dfe9df;color:#50725c;font-weight:900;font-size:22px}
    h1{font-family:Georgia,serif;font-size:36px;line-height:.95;margin:0 0 8px}
    p{margin:0;color:#6d7872;font-size:13px}
  </style>
</head>
<body>
  <div id="loading"><div class="loadCard"><div class="mark">SC</div><h1>Second Chance</h1><p>Picking up right where you left off…</p></div></div>
  <iframe id="appFrame" title="Second Chance OS"></iframe>
  <script>
    const frame = document.getElementById('appFrame');
    const loading = document.getElementById('loading');
    frame.src = './growth-pilot.html' + window.location.search + window.location.hash;
    frame.addEventListener('load', () => loading.classList.add('hide'));
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
