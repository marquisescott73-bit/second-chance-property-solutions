name: Second Chance OS Root QA

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'os-theme.css'
      - 'scos-expenses.js'
      - 'scos-expenses.css'
      - '.github/workflows/scos-root-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Expenses JavaScript syntax
        run: node --check scos-expenses.js
      - name: Root OS expenses contract
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html','utf8');
          const js = fs.readFileSync('scos-expenses.js','utf8');
          const css = fs.readFileSync('scos-expenses.css','utf8');
          const requiredHtml = ['data-scos-expenses-css="1"','data-scos-expenses-js="1"','scos-expenses.css','scos-expenses.js'];
          for (const s of requiredHtml) if (!html.includes(s)) throw new Error('Root OS missing '+s);
          if ((html.match(/data-scos-expenses-css="1"/g)||[]).length !== 1) throw new Error('Expenses CSS tag must appear exactly once');
          if ((html.match(/data-scos-expenses-js="1"/g)||[]).length !== 1) throw new Error('Expenses JS tag must appear exactly once');
          for (const s of ['business_expenses','organization_members','tax-documents','Expenses & Reimbursements','reimbursementStatus','deductiblePercent']) if (!js.includes(s)) throw new Error('Expenses runtime missing '+s);
          for (const s of ['#scosExpensesTile','.scos-expense-overlay','.scos-expense-table','.scos-expense-form-grid']) if (!css.includes(s)) throw new Error('Expenses styles missing '+s);
          const reportStart = html.indexOf('printWindow.document.write');
          if (reportStart >= 0) {
            const reportChunk = html.slice(reportStart, reportStart + 1800);
            if (reportChunk.includes('data-scos-expenses-js')) throw new Error('Expenses runtime must not be injected into report print markup');
          }
          const marker = html.indexOf('Everything is still here');
          if (marker >= 0) {
            console.log('CONTROL_TOWER_CONTEXT_START');
            console.log(html.slice(Math.max(0, marker - 2200), marker + 5200));
            console.log('CONTROL_TOWER_CONTEXT_END');
          } else {
            console.log('Control Tower heading is generated dynamically; runtime tile fallback remains active.');
          }
          console.log('PASS: Expenses & Reimbursements runtime, styles, cloud table hooks, and safe root wiring are present');
          NODE

      - name: Login and navigation regression guards
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html','utf8');
          const required = [
            'allowOwnerBootstrap: false',
            'Authorized cloud login is required.',
            'context?.mode !== "cloud"',
            'Settings & Backup',
            'scos-navigation-upgrade-20261021',
            'id="contact"',
            'data-scos22-proposal-center',
            'navigate("quotes")'
          ];
          for (const text of required) if (!html.includes(text)) throw new Error('Missing required security/UX guard: '+text);
          if (html.includes('data-preview-role="owner"')) throw new Error('Public Owner preview shortcut returned');
          if (html.includes('allowOwnerBootstrap: true')) throw new Error('Owner bootstrap reenabled in public client');
          if (html.includes('./proposals.html')) throw new Error('Broken standalone Proposal Center link returned');
          for (const anchor of ['services','contracts','method','contact']) {
            if (!html.includes('href="#'+anchor+'"') || !html.includes('id="'+anchor+'"'))
              throw new Error('Public website navigation missing section '+anchor);
          }
          console.log('PASS: OS cloud-login and navigation source regression guards');
          NODE

      - name: Documentation Center expense deletion regression test
        run: |
          node <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html','utf8');
          const js = fs.readFileSync('scos-expenses.js','utf8');
          const requiredHtml = [
            'function tc2RecordedExpenseRegister()',
            'data-tc2-action="delete-expense"',
            'if(action==="delete-expense")',
            'if(!tc2IsFullTaxAdmin())',
            '.eq("organization_id",authContext.organizationId).eq("id",expense.id)',
            'voidedAt:now',
            'tcSave("Expense removed from active records."',
            'if (expense?.voidedAt) return 0;'
          ];
          const requiredJs = [
            'if (p.voidedAt) return false;',
            '.filter(row => !row.voidedAt)',
            'voidedAt: now',
            'Receipt and audit history preserved.'
          ];
          for (const value of requiredHtml) if (!html.includes(value)) throw new Error('Missing documented expense correction guard: '+value);
          for (const value of requiredJs) if (!js.includes(value)) throw new Error('Missing expense-screen correction guard: '+value);
          if (js.includes('.delete().eq("organization_id", state.orgId)')) throw new Error('Hard-delete of expense records was reintroduced');
          if (js.includes('RECEIPT_BUCKET).remove([p.receiptPath]')) throw new Error('Deleting an expense would destroy its receipt');
          console.log('PASS: expense removal is owner/COO gated, organization-scoped, and receipt preserving');
          NODE
