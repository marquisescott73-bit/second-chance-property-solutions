name: Second Chance Public QA

on:
  push:
    branches: [main]
    paths:
      - 'second-chance/**'
      - '.github/workflows/second-chance-public-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Public app JavaScript syntax
        run: |
          node --check second-chance/app.js
          node --check second-chance/recovery-pre.js
          node --check second-chance/enhancements.js
          node --check second-chance/sw.js
          node --check second-chance/preview.js
      - name: Public account app contract
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('second-chance/index.html','utf8');
          const js=fs.readFileSync('second-chance/app.js','utf8');
          const enh=fs.readFileSync('second-chance/enhancements.js','utf8');
          const pre=fs.readFileSync('second-chance/recovery-pre.js','utf8');
          const sw=fs.readFileSync('second-chance/sw.js','utf8');
          const combined=html+'\n'+js;
          const manifest=JSON.parse(fs.readFileSync('second-chance/manifest.webmanifest','utf8'));
          for(const s of ['Start My Second Chance','I Already Have Access','cover-art.svg','app.js']) if(!combined.includes(s)) throw new Error('Opening screen missing '+s);
          for(const s of ['/auth/v1/signup','grant_type=password','sc-growth-public','bootstrap','complete_step','save_reflection','save_action','save_scores']) if(!js.includes(s)) throw new Error('Public app missing '+s);
          for(const s of ['/auth/v1/recover','/auth/v1/user','Forgot password?','Check your email','Something ain’t working','sc-growth-report','userAgent']) if(!enh.includes(s)) throw new Error('Account polish missing '+s);
          for(const s of ["type')==='recovery'",'access_token','__SC_RECOVERY__']) if(!pre.includes(s)) throw new Error('Recovery preflight missing '+s);
          for(const s of ['./recovery-pre.js','./enhancements.js','public-2']) if(!html.includes(s)) throw new Error('New runtime asset missing '+s);
          if(!sw.includes("second-chance-public-v2")||!sw.includes("./enhancements.js")||!sw.includes("./recovery-pre.js")) throw new Error('Service worker cache was not bumped for account polish');
          if(!js.includes('STEPS[S.step-1]')) throw new Error('51-step content engine not connected');
          if(!js.includes("n>=51")&&!js.includes("x.n>=51")) throw new Error('Final completion path missing');
          if(manifest.display!=='standalone'||manifest.start_url!=='./') throw new Error('PWA manifest wrong');
          console.log('PASS: public signup/login, password recovery, confirmation flow, bug reporting, journey engine, cover, and PWA wiring present');
          NODE
      - name: Full preview contract
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('second-chance/preview.html','utf8');
          const js=fs.readFileSync('second-chance/preview.js','utf8');
          for(const s of ['Second Chance Preview','READ-ONLY','Graduate certificate','preview.js']) if(!html.includes(s)) throw new Error('Preview shell missing '+s);
          for(const s of ['for(let i=1;i<=51;i++)','reward(7)','reward(21)','reward(51)','function blueprint','function certificate','STEPS[step-1]']) if(!js.includes(s)) throw new Error('Preview missing '+s);
          if(/fetch\s*\(/.test(js)) throw new Error('Preview must remain read-only with no network writes');
          console.log('PASS: full read-only preview includes all 51 steps, level rewards, Blueprint, and certificate');
          NODE
