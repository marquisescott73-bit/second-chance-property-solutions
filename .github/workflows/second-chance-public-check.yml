name: Second Chance Public QA

on:
  push:
    branches: [main]
    paths:
      - 'second-chance/**'
      - '.github/workflows/second-chance-public-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Public app JavaScript syntax
        run: |
          node --check second-chance/app.js
          node --check second-chance/sw.js
      - name: Public account app contract
        run: |
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('second-chance/index.html','utf8');
          const js=fs.readFileSync('second-chance/app.js','utf8');
          const combined=html+'\n'+js;
          const manifest=JSON.parse(fs.readFileSync('second-chance/manifest.webmanifest','utf8'));
          for(const s of ['Start My Second Chance','I Already Have Access','cover-art.svg','app.js']) if(!combined.includes(s)) throw new Error('Opening screen missing '+s);
          for(const s of ['/auth/v1/signup','grant_type=password','sc-growth-public','bootstrap','complete_step','save_reflection','save_action','save_scores']) if(!js.includes(s)) throw new Error('Public app missing '+s);
          if(!js.includes('STEPS[S.step-1]')) throw new Error('51-step content engine not connected');
          if(!js.includes("n>=51")&&!js.includes("x.n>=51")) throw new Error('Final completion path missing');
          if(manifest.display!=='standalone'||manifest.start_url!=='./') throw new Error('PWA manifest wrong');
          console.log('PASS: public signup/login, account backend calls, journey engine, cover, and PWA wiring present');
          NODE
