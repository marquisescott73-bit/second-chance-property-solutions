name: Wire SCOS Expenses Module

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/scos-expenses-wire.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire-expenses:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Wire expenses assets safely in the document head
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          # Remove any prior runtime tag wherever it landed. An earlier pass could
          # encounter a literal </body> inside a report-print template string.
          old_tags = [
              '  <script src="scos-expenses.js?v=20260829-1" data-scos-expenses-js="1" defer></script>\n',
              '  <script src="scos-expenses.js?v=20260829-2" data-scos-expenses-js="1" defer></script>\n',
          ]
          for old in old_tags:
              text = text.replace(old, '')

          css_tag = '  <link rel="stylesheet" href="scos-expenses.css?v=20260829-1" data-scos-expenses-css="1" />\n'
          if css_tag not in text:
              if '</head>' not in text:
                  raise SystemExit('Could not find </head> in index.html')
              text = text.replace('</head>', css_tag + '</head>', 1)

          js_tag = '  <script src="scos-expenses.js?v=20260829-2" data-scos-expenses-js="1" defer></script>\n'
          if js_tag not in text:
              text = text.replace(css_tag, css_tag + js_tag, 1)

          if text.count('data-scos-expenses-js="1"') != 1:
              raise SystemExit('Expected exactly one expenses runtime tag')
          if text.count('data-scos-expenses-css="1"') != 1:
              raise SystemExit('Expected exactly one expenses stylesheet tag')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit wired OS page
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Expenses module is already wired safely."
            exit 0
          fi
          git commit -m "Fix Expenses & Reimbursements runtime wiring"
          git push
