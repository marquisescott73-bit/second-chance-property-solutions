<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f3eb">
<title>Second Chance · Talk It Through</title>
<style>
:root{--cream:#f7f3eb;--paper:#fffdfa;--ink:#2f3b35;--muted:#6d7872;--terra:#c87559;--sage:#dfe9df;--line:#ddd8cf;--blue:#e7eef2}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--cream);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button,input,textarea{font:inherit}
.chat-app{min-height:100svh;display:grid;grid-template-rows:auto 1fr auto}.chat-head{position:sticky;top:0;z-index:5;background:rgba(247,243,235,.96);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:max(12px,env(safe-area-inset-top)) 14px 12px}.head-row{width:min(860px,100%);margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.back{border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:9px 11px;color:#5b665f;font-weight:800;cursor:pointer}.who{text-align:center;flex:1}.who strong{display:block;font-family:Georgia,serif;font-size:22px;line-height:1}.who small{display:block;color:var(--muted);margin-top:5px}.status-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#6f8c78;margin-right:5px}.eta{width:min(860px,100%);margin:9px auto 0;background:#fff3ea;border:1px solid #ecd4c7;border-radius:13px;padding:9px 11px;text-align:center;font-size:12px;color:#76564a;font-weight:750}
.chat-main{width:min(860px,100%);margin:auto;padding:18px 14px 110px}.welcome{background:linear-gradient(145deg,#fffdfa,#f4e6d9);border:1px solid var(--line);border-radius:22px;padding:18px;margin-bottom:18px}.welcome .k{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:900;color:var(--terra)}.welcome h1{font-family:Georgia,serif;font-size:34px;line-height:1;margin:8px 0}.welcome p{margin:0;color:var(--muted);line-height:1.5}.privacy{font-size:12px;color:var(--muted);margin-top:10px}.crisis{font-size:11px;line-height:1.45;color:#76564a;background:#fff3ea;border:1px solid #ecd4c7;border-radius:12px;padding:10px;margin-top:10px}.messages{display:grid;gap:9px}.msg{display:flex}.msg.me{justify-content:flex-end}.bubble{max-width:min(78%,620px);border-radius:18px;padding:11px 13px;line-height:1.42;white-space:pre-wrap;word-break:break-word;box-shadow:0 3px 12px rgba(47,59,53,.04)}.msg.them .bubble{background:var(--paper);border:1px solid var(--line);border-bottom-left-radius:5px}.msg.me .bubble{background:#c87559;color:white;border-bottom-right-radius:5px}.meta{font-size:10px;margin-top:5px;opacity:.72}.context{font-size:10px;font-weight:800;letter-spacing:.02em;margin-bottom:5px;opacity:.8}.empty{text-align:center;color:var(--muted);padding:34px 16px}.composer{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(247,243,235,.97);border-top:1px solid var(--line);padding:10px 12px max(10px,env(safe-area-inset-bottom))}.compose-row{width:min(860px,100%);margin:auto;display:flex;gap:9px;align-items:flex-end}.compose-row textarea{flex:1;resize:none;max-height:130px;min-height:48px;border:1px solid #d4d9d4;border-radius:17px;padding:13px;background:white;color:var(--ink);outline:none}.compose-row textarea:focus{border-color:#c87559;box-shadow:0 0 0 3px rgba(200,117,89,.1)}.send{width:50px;height:50px;border:0;border-radius:16px;background:#c87559;color:white;font-size:21px;font-weight:900;cursor:pointer}.send:disabled{opacity:.55}.send-note{width:min(860px,100%);margin:5px auto 0;color:var(--muted);font-size:10px;text-align:center}
.inbox-shell{width:min(920px,100%);margin:auto;padding:18px 14px}.admin-title{font-family:Georgia,serif;font-size:36px;line-height:1;margin:8px 0}.admin-sub{color:var(--muted);line-height:1.45}.admin-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.alert-toggle{border:1px solid #cbd5cd;background:#eef3ee;color:#52645a;border-radius:999px;padding:9px 12px;font-weight:850;cursor:pointer}.thread-list{display:grid;gap:9px;margin-top:18px}.thread{display:grid;grid-template-columns:1fr auto;gap:10px;background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:13px;text-align:left;color:var(--ink);cursor:pointer}.thread strong{font-size:15px}.thread p{margin:5px 0 0;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:650px}.thread small{display:block;color:#858b86;margin-top:5px}.unread{align-self:center;min-width:24px;height:24px;border-radius:999px;background:#c87559;color:#fff;display:grid;place-items:center;font-size:11px;font-weight:900}.progress-pill{display:inline-block;background:#eef3ee;border-radius:999px;padding:3px 7px;font-size:10px;color:#5c6e61;margin-left:5px}.quick-replies{display:flex;gap:8px;flex-wrap:wrap;margin:-4px 0 16px}.quick-replies small{width:100%;font-size:10px;letter-spacing:.1em;color:#778179;font-weight:900}.quick{border:1px solid #d7ddd8;background:#fffdfa;color:#56635b;border-radius:999px;padding:8px 10px;font-size:11px;font-weight:800;cursor:pointer}.quick:hover{border-color:#c87559;color:#a65f49}.auth{min-height:100svh;display:grid;place-items:center;padding:22px}.auth-card{width:min(480px,100%);background:var(--paper);border:1px solid var(--line);border-radius:24px;padding:22px}.auth-card h1{font-family:Georgia,serif;font-size:38px;line-height:1}.field{margin:12px 0}.field label{display:block;font-weight:800;font-size:12px;margin-bottom:5px}.field input{width:100%;border:1px solid #d6ddd7;border-radius:13px;padding:12px;background:white}.primary{width:100%;min-height:48px;border:0;border-radius:14px;background:#c87559;color:white;font-weight:900;cursor:pointer}.error{background:#f7e5de;color:#8c4b37;border-radius:12px;padding:10px;margin-top:10px}.loading{text-align:center;color:var(--muted);padding:28px}.creator-chat .welcome{background:linear-gradient(145deg,#fffdfa,#eaf0eb)}
@media(max-width:620px){.bubble{max-width:86%}.welcome h1{font-size:30px}.admin-title{font-size:32px}.who strong{font-size:19px}.eta{font-size:11px}.quick{font-size:10px}}
</style>
</head>
<body><div id="chatRoot"><div class="loading">Opening chat…</div></div><script src="./chat.js?v=chat-2"></script></body>
</html>
