<style>
:root{--cream:#f7f3eb;--paper:#fffdfa;--ink:#2f3b35;--muted:#6d7872;--terra:#c87559;--line:#d9d7cf;--sage:#dfe9df}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--cream);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
body{padding-top:72px}.previewbar{position:fixed;z-index:9999;top:0;left:0;right:0;min-height:62px;background:rgba(47,59,53,.97);color:#fffdfa;display:flex;align-items:center;gap:9px;padding:9px 12px;box-shadow:0 7px 22px rgba(0,0,0,.15);overflow-x:auto}.previewbar strong{white-space:nowrap;font-family:Georgia,serif}.previewbar select,.previewbar button{border:1px solid rgba(255,255,255,.2);background:#fffdfa;color:#2f3b35;border-radius:11px;min-height:38px;padding:7px 10px;font-weight:800;white-space:nowrap}.previewbar .note{font-size:11px;opacity:.76;white-space:nowrap}.previewbar .live{background:#c87559;color:white;border-color:#c87559}.preview-cover{min-height:calc(100svh - 72px);display:grid;place-items:center;padding:22px;background:radial-gradient(circle at 18% 12%,rgba(255,255,255,.82),transparent 34%),linear-gradient(180deg,#fbf5ea,#f3e6d5)}.cover-wrap{width:min(480px,100%);text-align:center}.cover-brand{font-family:Georgia,serif;font-size:40px;letter-spacing:-.04em;margin:0;color:#4a3d34}.cover-sub{color:#c87559;margin:6px 0 18px}.cover-line{font-family:Georgia,serif;font-size:34px;line-height:1.02;margin:0 0 18px;color:#53463d}.cover-line em{font-style:normal;color:#c87559}.cover-art{width:min(340px,85vw);filter:drop-shadow(0 22px 30px rgba(79,62,48,.18));margin:0 auto 18px;display:block}.cover-actions{display:grid;gap:11px;margin-top:12px}.cover-actions button{min-height:54px;border-radius:16px;font-size:16px;font-weight:850;cursor:pointer}.cover-primary{border:0;background:linear-gradient(90deg,#d88865,#e0a17f);color:white}.cover-secondary{border:1.5px solid #d88865;background:rgba(255,253,250,.58);color:#b76b4e}.cover-note{font-size:12px;color:#6b635d;margin-top:12px}.auth-wrap{min-height:calc(100svh - 72px);padding:22px;display:grid;place-items:center}.auth-card{width:min(520px,100%);background:var(--paper);border:1px solid var(--line);border-radius:28px;padding:24px;box-shadow:0 14px 45px rgba(47,59,53,.07)}.auth-card h1,.auth-card h2{font-family:Georgia,serif;letter-spacing:-.035em}.auth-card h1{font-size:42px;line-height:.96}.field{margin:14px 0}.field label{display:block;font-weight:800;margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid #d6ddd7;background:#fff;color:#34423a;border-radius:14px;padding:13px}.btn-main{width:100%;min-height:48px;border:0;border-radius:14px;background:var(--terra);color:#fff;font-weight:850}.muted{color:var(--muted);line-height:1.55}.preview-card{width:min(1000px,calc(100% - 28px));margin:24px auto;background:var(--paper);border:1px solid var(--line);border-radius:26px;padding:22px}.preview-grid{display:grid;grid-template-columns:1.6fr .8fr;gap:18px}.hero-preview{background:#f0dccd;border-radius:25px;padding:28px}.hero-preview h1,.preview-card h1,.preview-card h2{font-family:Georgia,serif;letter-spacing:-.04em}.hero-preview h1{font-size:52px;line-height:.94;margin:10px 0}.tag{display:inline-flex;border-radius:999px;background:#e8eee7;padding:7px 10px;font-size:11px;font-weight:900;letter-spacing:.08em}.panel{background:#fffdfa;border:1px solid #d9d7cf;border-radius:22px;padding:20px;margin-bottom:15px}.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.stat{background:#f1f5f0;border:1px solid #dbe2db;border-radius:15px;padding:12px}.stat small{display:block;color:#6d7872}.stat strong{font-family:Georgia,serif;font-size:28px}.stepbar{height:9px;background:#e5e4de;border-radius:999px;overflow:hidden}.stepbar span{display:block;height:100%;background:#c87559;border-radius:999px}.levels{display:grid;gap:9px;margin-top:15px}.level{border:1px solid #d6ddd7;border-radius:16px;padding:13px}.level.active{background:#e7efe5}.level.locked{opacity:.54}.stepwrap{width:min(760px,calc(100% - 28px));margin:24px auto}.progress{display:flex;justify-content:space-between;font-size:12px;font-weight:850;color:#69746e;margin-bottom:9px}.talk{font-family:Georgia,serif;font-size:25px;line-height:1.3}.moment,.coachline,.statusbox,.privacy{border-radius:16px;padding:14px;margin:14px 0}.moment{background:#f5ddcf}.coachline{background:#e5edf1}.statusbox{background:#edf3eb;border:1px solid #d9e1d9}.privacy{background:#f2f1ec}.choice-grid{display:grid;gap:9px}.choice,.chip{border:1px solid #ccd5cf;background:#fff;border-radius:13px;padding:13px;text-align:left;font-weight:750}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}.btn{border:0;border-radius:13px;padding:12px 15px;background:#c87559;color:white;font-weight:850}.btn.secondary{background:#fff;color:#55625b;border:1px solid #ccd5cf}.blueprint{background:linear-gradient(145deg,#eff4ed,#fffdfa);border:1px solid #ced9ce}.cert{border:2px solid #c87559;text-align:center;padding:28px;border-radius:20px;background:#fffdf8}.cert h2{font-size:38px}.screen-note{font-size:12px;color:#7c837f;text-align:center;margin:10px 0 30px}.setup-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.setup-score{background:#f4f7f3;border:1px solid #d9ded9;border-radius:14px;padding:11px}.setup-score input{width:100%;accent-color:#c87559}.agreement{display:block;background:#f6f8f5;border:1px solid #d9ded9;padding:11px;border-radius:13px;margin:8px 0}.preview-warning{background:#fff2dc;color:#795824;border:1px solid #eed6aa;padding:10px 13px;border-radius:12px;font-size:12px;margin-bottom:14px}.preview-footer{text-align:center;color:#7c837f;font-size:12px;padding:18px 18px 30px}@media(max-width:720px){body{padding-top:112px}.previewbar{flex-wrap:wrap;min-height:102px}.previewbar .note{width:100%}.preview-grid{grid-template-columns:1fr}.stat-grid{grid-template-columns:repeat(2,1fr)}.setup-grid{grid-template-columns:1fr}.hero-preview h1{font-size:42px}.cover-brand{font-size:34px}.cover-line{font-size:29px}}
</style>
</head>
<body>
<div class="previewbar">
  <strong>Second Chance Preview</strong>
  <select id="screenPick" aria-label="Preview screen">
    <option value="cover">Opening cover</option>
    <option value="signup">Create account</option>
    <option value="login">Login</option>
    <option value="setup">Onboarding</option>
    <option value="home">Journey home</option>
    <option value="step">Step preview</option>
    <option value="receipts">Receipts</option>
    <option value="reward7">WAKE UP reward</option>
    <option value="reward21">LOCK IN reward</option>
    <option value="reward51">BECOME reward</option>
    <option value="blueprint">Final Blueprint</option>
    <option value="certificate">Graduate certificate</option>
  </select>
  <select id="stepPick" aria-label="Step number"></select>
  <select id="sectionPick" aria-label="Step section">
    <option value="0">Real Talk</option><option value="1">Check Yourself</option><option value="2">Make A Move</option><option value="3">Receipts</option>
  </select>
  <button id="prevStep">← Step</button><button id="nextStep">Step →</button>
  <button class="live" id="openLive">Open live app</button>
  <span class="note">READ-ONLY · nothing here saves</span>
</div>
<div id="previewApp"></div>
<div class="preview-footer">Preview Mode · Second Chance · No account or progress is created from this page.</div>

</html>
